<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Demandas de TI</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mut:#6b7788;--bd:#e3e8ef;--pri:#2457d6;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#14213d;color:#fff;padding:20px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.75}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.ctl select option{color:#000}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kpi small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:30px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;font-size:14px}
.row{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{background:#eef1f6;border-radius:6px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.row em{font-style:normal;text-align:right;color:var(--mut)}
.months{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:8px}
.m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.m .pair{display:flex;gap:3px;align-items:flex-end;height:130px}
.m .pair i{width:16px;border-radius:4px 4px 0 0;display:block;min-height:2px}
.legend{font-size:12px;color:var(--mut);margin-top:6px}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.s-Aberto{background:#fee2e2;color:var(--bad)}.s-Em{background:#dbeafe;color:var(--pri)}.s-Aguardando{background:#fef3c7;color:var(--warn)}.s-Resolvido{background:#dcfce7;color:var(--ok)}
.p-Alta{color:var(--bad);font-weight:600}.p-Media{color:var(--warn)}.p-Baixa{color:var(--mut)}
#msg{padding:30px;text-align:center;color:var(--mut)}
@media print{header .ctl{display:none}body{background:#fff}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div><h1>Painel de Demandas de TI</h1><p id="sub">Carregando…</p></div>
  <div class="ctl">
    <select id="per"><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="365">Últimos 12 meses</option><option value="0" selected>Todo o período</option></select>
    <button onclick="load()">Atualizar</button>
    <button onclick="window.print()">Imprimir / PDF</button>
  </div>
</header>
<main>
  <div id="msg">Carregando chamados…</div>
  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="card"><h2>Abertos x resolvidos por mês</h2><div class="months" id="months"></div><div class="legend"><b style="background:var(--pri)"></b>Abertos<b style="background:var(--ok)"></b>Resolvidos</div></div>
      <div class="card"><h2>Por categoria</h2><div id="cat"></div></div>
      <div class="card"><h2>Por setor</h2><div id="setor"></div></div>
      <div class="card"><h2>Por solicitante</h2><div id="sol"></div></div>
      <div class="card"><h2>Por prioridade</h2><div id="pri"></div></div>
    </div>
    <div class="card" style="margin-top:12px"><h2>Chamados do período</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Título</th><th>Solicitante</th><th>Setor</th><th>Categoria</th><th>Prior.</th><th>Status</th><th>Abertura</th><th>Resolução</th><th>Nota</th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
  </div>
</main>
<script>
// Endpoint da API "Chamados - API" (n8n). Use ?demo=1 para ver com dados de exemplo.
const API='https://webhook.servidorwall.online/webhook/chamados-listar';
let DATA=[];
const $=id=>document.getElementById(id);
const d10=s=>s?String(s).slice(0,10):'';
const fmt=s=>s?d10(s).split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stCls=s=>'s-'+String(s||'').split(' ')[0];
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

async function load(){
  $('msg').hidden=false;$('msg').textContent='Carregando chamados…';
  try{
    if(new URLSearchParams(location.search).has('demo')){DATA=demo();}
    else{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();DATA=Array.isArray(j)?j:(j.chamados||[]);}
    render();
  }catch(e){$('msg').textContent='Não foi possível carregar os chamados ('+e.message+'). Verifique se o workflow "Chamados - API" está ativo e se o painel está hospedado no mesmo domínio do servidor.';$('app').hidden=true;}
}

function render(){
  const days=+$('per').value;
  const lim=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):'';
  const L=DATA.filter(c=>!lim||d10(c.dataAbertura)>=lim||d10(c.dataResolucao)>=lim).sort((a,b)=>b.numero-a.numero);
  $('msg').hidden=true;$('app').hidden=false;
  $('sub').textContent=L.length+' demandas no período · atualizado em '+new Date().toLocaleString('pt-BR');
  const res=L.filter(c=>c.status==='Resolvido');
  const abertos=L.filter(c=>c.status!=='Resolvido');
  const tempos=res.filter(c=>c.dataAbertura&&c.dataResolucao).map(c=>(new Date(d10(c.dataResolucao))-new Date(d10(c.dataAbertura)))/864e5);
  const tm=tempos.length?(tempos.reduce((a,b)=>a+b,0)/tempos.length):null;
  const taxa=L.length?Math.round(res.length/L.length*100):0;
  const notas=L.filter(c=>typeof c.nota==='number'&&c.nota>0).map(c=>c.nota);
  const nm=notas.length?(notas.reduce((a,b)=>a+b,0)/notas.length):null;
  const k=[['Total de demandas',L.length],['Resolvidas',res.length],['Em aberto',abertos.length],['Taxa de resolução',taxa+'%'],['Tempo médio de resolução',tm===null?'—':(tm<1?'< 1 dia':tm.toFixed(1).replace('.',',')+' dias')],['Avaliação média',nm===null?'—':nm.toFixed(1).replace('.',',')+' / 5 <span style="font-size:12px;color:var(--mut)">('+notas.length+')</span>']];
  $('kpis').innerHTML=k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');

  // por mês
  const mm={};
  L.forEach(c=>{const a=d10(c.dataAbertura).slice(0,7);if(a){mm[a]=mm[a]||{a:0,r:0};mm[a].a++;}
    if(c.status==='Resolvido'){const r=d10(c.dataResolucao).slice(0,7);if(r){mm[r]=mm[r]||{a:0,r:0};mm[r].r++;}}});
  const keys=Object.keys(mm).sort().slice(-8);const mx=Math.max(1,...keys.map(k=>Math.max(mm[k].a,mm[k].r)));
  $('months').innerHTML=keys.map(k=>`<div class="m"><div class="pair"><i style="height:${mm[k].a/mx*100}%;background:var(--pri)" title="Abertos: ${mm[k].a}"></i><i style="height:${mm[k].r/mx*100}%;background:var(--ok)" title="Resolvidos: ${mm[k].r}"></i></div>${k.slice(5)}/${k.slice(2,4)}</div>`).join('')||'<span style="color:var(--mut);font-size:13px">Sem dados</span>';

  const group=(f)=>{const o={};L.forEach(c=>{const v=f(c)||'Não informado';o[v]=(o[v]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
  const bars=(arr)=>{const m=Math.max(1,...arr.map(x=>x[1]));return arr.map(([n,v])=>`<div class="row"><span title="${esc(n)}">${esc(n)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><em>${v}</em></div>`).join('')||'<span style="color:var(--mut);font-size:13px">Sem dados</span>';};
  $('cat').innerHTML=bars(group(c=>c.categoria));
  $('setor').innerHTML=bars(group(c=>c.setor));
  $('sol').innerHTML=bars(group(c=>c.solicitante));
  const ord={Alta:0,Media:1,Baixa:2};
  $('pri').innerHTML=bars(group(c=>norm(c.prioridade)).sort((a,b)=>(ord[a[0]]??9)-(ord[b[0]]??9)));

  $('tb').innerHTML=L.map(c=>`<tr><td>${c.numero}</td><td><b>${esc(c.titulo)}</b>${c.notas?`<div style="color:var(--mut);font-size:12px;margin-top:2px">${esc(c.notas)}</div>`:''}</td><td>${esc(c.solicitante)}</td><td>${esc(c.setor||'—')}</td><td>${esc(c.categoria)}</td><td class="p-${norm(c.prioridade)}">${esc(c.prioridade)}</td><td><span class="tag ${stCls(c.status)}">${esc(c.status)}</span></td><td>${fmt(c.dataAbertura)}</td><td>${fmt(c.dataResolucao)}</td><td>${typeof c.nota==='number'?'★ '+c.nota:'—'}${c.comentarioAvaliacao?`<div style="color:var(--mut);font-size:12px">${esc(c.comentarioAvaliacao)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="10" style="color:var(--mut)">Nenhum chamado no período.</td></tr>';
}

function demo(){const hoje=new Date();const dd=n=>new Date(hoje-n*864e5).toISOString().slice(0,10);
return [
{numero:1,titulo:'Ajustar relatório de ponto',solicitante:'Nathalia',categoria:'Ajuste',prioridade:'Alta',status:'Resolvido',dataAbertura:dd(40),dataResolucao:dd(38),notas:'',setor:'RH',nota:5,comentarioAvaliacao:'Rápido e certeiro'},
{numero:2,titulo:'Novo notebook para RH',solicitante:'Fernanda',categoria:'Infraestrutura',prioridade:'Media',status:'Resolvido',dataAbertura:dd(30),dataResolucao:dd(27),notas:''},
{numero:3,titulo:'Automação de cobrança',solicitante:'Veronica',categoria:'Automação',prioridade:'Alta',status:'Em andamento',dataAbertura:dd(12),dataResolucao:null,notas:'Em desenvolvimento'},
{numero:4,titulo:'Acesso ao sistema de frotas',solicitante:'Nathalia',categoria:'Suporte',prioridade:'Baixa',status:'Aberto',dataAbertura:dd(3),dataResolucao:null,notas:''}];}

$('per').onchange=()=>DATA.length&&render();
load();
</script>
</body>
</html>
